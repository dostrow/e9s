name: Release

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      release_tag:
        description: Existing version tag to package and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-tui:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: freebsd
            goarch: amd64
            suffix: freebsd-amd64
          - goos: freebsd
            goarch: arm64
            suffix: freebsd-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64.exe
          - goos: windows
            goarch: arm64
            suffix: windows-arm64.exe

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -ldflags="-s -w -X main.version=${{ inputs.release_tag || github.ref_name }}" -o e9s-${{ matrix.suffix }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: e9s-${{ matrix.suffix }}
          path: e9s-${{ matrix.suffix }}

  build-linux-desktop:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install native packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            appstream desktop-file-utils dpkg-dev file curl patchelf \
            gobject-introspection libfontconfig-dev libgtk-4-dev libgtksourceview-5-dev \
            libvte-2.91-gtk4-dev pkg-config

      - name: Validate desktop metadata
        run: |
          desktop-file-validate packaging/linux/io.github.dostrow.e9s.desktop
          appstreamcli validate --no-net packaging/linux/io.github.dostrow.e9s.metainfo.xml

      - name: Test and build native frontends
        run: |
          go test ./...
          go test -tags gui ./internal/gui
          make build build-gui VERSION=${{ inputs.release_tag || github.ref_name }}

      - name: Build Debian packages
        env:
          E9S_TUI_BINARY: ${{ github.workspace }}/e9s
          E9S_GUI_BINARY: ${{ github.workspace }}/e9s-gui
        run: packaging/debian/build-debs.sh "${{ inputs.release_tag || github.ref_name }}" "$PWD/dist"

      - name: Build AppImage
        env:
          E9S_GUI_BINARY: ${{ github.workspace }}/e9s-gui
        run: packaging/appimage/build-appimage.sh "${{ inputs.release_tag || github.ref_name }}" "$PWD/dist"

      - name: Upload Linux desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: e9s-linux-desktop-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.AppImage

  release:
    needs: [build-tui, build-linux-desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: find . -maxdepth 1 -type f ! -name checksums.txt -printf '%f\n' | sort | xargs sha256sum > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: artifacts/*
